<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Mafer 💌</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<audio id="bgMusic" loop>
  <source src="music/sabes-una-cosa.mp3" type="audio/mpeg">
</audio>

<div class="loader" id="loader">
  <h1>Hola Amor 💞</h1>
</div>

<div class="scene hidden" id="scene">

  <div class="envelope" id="envelope">
    <div class="flap"></div>
    <div class="text">Ábreme 💌</div>
  </div>

 <div class="letter hidden" id="letter">
  <h2>Corazón 💖</h2>
  <p id="typeText"></p>

  <button class="memories-btn" onclick="goToMemories()">
    Ver nuestros recuerdos 💕
  </button>

  <h3 class="finalMessage hidden" id="finalMessage">
    Gracias por compartir tu tiempo conmigo 💖
  </h3>
</div>


</div>

<div class="petals" id="petals"></div>

<script src="index.js"></script>
</body>
</html>
